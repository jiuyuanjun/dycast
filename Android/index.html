<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>DyCast</title>
  <script src="./mssdk.js"></script>
</head>
<body>
  <div id="app"></div>
  <script>
    /* 热更新引导：存在热更标记时，移除内置入口脚本，改从 hotres:// 协议加载新版前端。
       任何一步出错都不影响内置资源加载；8s 内入口未完成启动则清除标记回退并刷新一次
       （sessionStorage 防循环，App 冷启动自动重试热更）。 */
    (function () {
      try {
        var raw = localStorage.getItem('dycast_hot_boot');
        if (!raw) return;
        if (sessionStorage.getItem('dycast_hot_fallback')) return;
        var cfg = JSON.parse(raw) || {};
        var cfs = window.__TAURI_INTERNALS__ && window.__TAURI_INTERNALS__.convertFileSrc;
        if (!cfg.version || !cfg.js || !cfs) return;
        var base = cfg.version + '/';
        if (cfg.css) {
          var link = document.createElement('link');
          link.rel = 'stylesheet';
          link.href = cfs(base + cfg.css, 'hotres');
          (document.head || document.documentElement).appendChild(link);
        }
        // 移除内置入口（构建后位于 head 的 module script；defer 语义下移除即不执行）
        var bundled = document.querySelector('script[type="module"]');
        if (bundled && bundled.parentNode) bundled.parentNode.removeChild(bundled);
        var boot = document.currentScript;
        var hot = document.createElement('script');
        hot.type = 'module';
        hot.src = cfs(base + cfg.js, 'hotres');
        (document.head || document.documentElement).appendChild(hot);
        setTimeout(function () {
          if (!window.__DYCAST_BOOTED) {
            try {
              sessionStorage.setItem('dycast_hot_fallback', '1');
              localStorage.removeItem('dycast_hot_boot');
              location.reload();
            } catch (e) {}
          }
        }, 8000);
      } catch (e) {
        console.error('[HotBoot] 引导失败，使用内置资源', e);
      }
    })();
  </script>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
