<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>方案 A - 竖屏单栏布局 | DyCast 安卓原型</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{background:#0f0f1a;display:flex;flex-direction:column;align-items:center;padding:24px 12px;min-height:100vh}
.scheme-title{color:#c9c9e0;font-size:13px;margin-bottom:18px;text-align:center;line-height:1.7;max-width:420px}
.scheme-title b{color:#fff;font-size:18px;display:block;margin-bottom:6px}
.scheme-title .tag{display:inline-block;background:#2a2a4a;color:#8ec5ff;font-size:11px;padding:2px 10px;border-radius:10px;margin:0 3px}

.phone{width:390px;height:844px;background:#1a1a2e;border-radius:42px;border:9px solid #05050a;box-shadow:0 24px 70px rgba(0,0,0,.7);position:relative;overflow:hidden;display:flex;flex-direction:column}
.phone::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:150px;height:26px;background:#05050a;border-radius:0 0 18px 18px;z-index:30}

.statusbar{height:38px;background:#1a1a2e;display:flex;justify-content:space-between;align-items:center;padding:0 26px;color:#fff;font-size:13px;font-weight:600;flex-shrink:0;position:relative;z-index:5}
.statusbar .right{display:flex;gap:6px;align-items:center}
.bar-sig{display:flex;gap:2px;align-items:flex-end}
.bar-sig i{display:block;width:3px;background:#fff;border-radius:1px}
.bar-sig i:nth-child(1){height:4px}.bar-sig i:nth-child(2){height:6px}.bar-sig i:nth-child(3){height:8px}.bar-sig i:nth-child(4){height:10px;opacity:.4}
.wifi{width:15px;height:11px;position:relative}
.wifi i{position:absolute;bottom:0;left:50%;transform:translateX(-50%);border:2px solid #fff;border-bottom:none;border-radius:50% 50% 0 0}
.wifi i:nth-child(1){width:15px;height:9px}
.wifi i:nth-child(2){width:8px;height:5px}
.wifi i:nth-child(3){width:3px;height:2px;border-radius:50%}
.batt{width:24px;height:12px;border:1.5px solid #fff;border-radius:3px;position:relative;padding:1.5px}
.batt::after{content:"";position:absolute;right:-3px;top:3px;width:2.5px;height:5px;background:#fff;border-radius:0 2px 2px 0}
.batt i{display:block;width:78%;height:100%;background:#5fd35f;border-radius:1px}

.topbar{height:58px;background:#20203a;display:flex;align-items:center;gap:8px;padding:0 12px;flex-shrink:0;border-bottom:1px solid #2c2c4e}
.room-input{flex:1;height:38px;background:#1a1a2e;border:1px solid #3a3a5e;border-radius:19px;padding:0 16px;color:#fff;font-size:14px;outline:none}
.room-input::placeholder{color:#6a6a8a}
.room-input:focus{border-color:#5b6cff}
.connect-btn{height:38px;padding:0 16px;background:linear-gradient(135deg,#5b6cff,#8e6cff);color:#fff;border:none;border-radius:19px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.connect-btn:hover{filter:brightness(1.1)}
.key-btn{width:38px;height:38px;background:#2a2a4a;border:1px solid #3a3a5e;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;position:relative}
.key-btn:hover{background:#3a3a5e}
.key-dot{position:absolute;top:4px;right:4px;width:8px;height:8px;border-radius:50%;background:#ff4d4f;border:2px solid #20203a}
.key-dot.ok{background:#5fd35f}
.key-svg{width:18px;height:18px;fill:none;stroke:#c9c9e0;stroke-width:2}

.content{flex:1;overflow:hidden;position:relative;background:#1a1a2e}
.tab-pane{position:absolute;inset:0;overflow-y:auto;padding:8px 12px 16px;display:none}
.tab-pane.active{display:block}
.tab-pane::-webkit-scrollbar{width:4px}
.tab-pane::-webkit-scrollbar-thumb{background:#3a3a5e;border-radius:2px}

.msg{display:flex;gap:10px;padding:9px 8px;border-radius:10px;align-items:flex-start}
.msg:hover{background:#22223e}
.avatar{width:34px;height:34px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:700;overflow:hidden}
.msg-body{flex:1;min-width:0}
.msg-name{font-size:12px;margin-bottom:3px;font-weight:600}
.msg-text{font-size:14px;color:#e8e8f0;line-height:1.5;word-break:break-word}

.gift-item{display:flex;align-items:center;gap:10px;padding:10px 8px;border-radius:10px;background:#22223e;margin-bottom:8px;border:1px solid #2c2c4e}
.gift-item:hover{background:#2a2a4a}
.gift-name{color:#ffd166;font-weight:600;font-size:13px}
.gift-count{color:#ffd166;font-weight:700;font-size:14px;margin-left:auto;background:rgba(255,209,102,.12);padding:2px 10px;border-radius:10px}
.gift-icon{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#ffd166,#ff9f43);display:flex;align-items:center;justify-content:center;color:#1a1a2e;font-weight:700;font-size:11px;flex-shrink:0}

.data-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:4px}
.data-card{background:#22223e;border:1px solid #2c2c4e;border-radius:14px;padding:14px 12px;display:flex;flex-direction:column;gap:6px}
.data-label{font-size:12px;color:#8a8aaa}
.data-value{font-size:22px;font-weight:700;color:#4fc3f7;line-height:1}
.data-value.gold{color:#ffd166}
.data-value.green{color:#5fd35f}
.data-value.pink{color:#ff6b9d}

.bottombar{height:54px;background:#20203a;display:flex;border-top:1px solid #2c2c4e;flex-shrink:0}
.tab-btn{flex:1;background:none;border:none;color:#6a6a8a;font-size:13px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-family:inherit;transition:color .2s}
.tab-btn.active{color:#5b6cff;font-weight:600}
.tab-btn:hover{color:#8e9bff}
.tab-ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2}

.sheet-mask{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:40;opacity:0;visibility:hidden;transition:opacity .25s,visibility .25s}
.sheet-mask.active{opacity:1;visibility:visible}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#22223e;border-radius:24px 24px 0 0;padding:20px 18px 30px;transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);z-index:41;box-shadow:0 -8px 30px rgba(0,0,0,.4)}
.sheet-mask.active .sheet{transform:translateY(0)}
.sheet-grip{width:40px;height:4px;background:#3a3a5e;border-radius:2px;margin:0 auto 16px}
.sheet-title{color:#fff;font-size:16px;font-weight:600;margin-bottom:14px}
.sheet-input{width:100%;height:42px;background:#1a1a2e;border:1px solid #3a3a5e;border-radius:10px;padding:0 14px;color:#fff;font-size:14px;outline:none;font-family:inherit}
.sheet-input:focus{border-color:#5b6cff}
.sheet-input::placeholder{color:#6a6a8a}
.sheet-hint{color:#8a8aaa;font-size:12px;line-height:1.7;margin:12px 0 16px}
.sheet-hint code{background:#1a1a2e;padding:1px 6px;border-radius:4px;color:#8ec5ff;font-size:11px}
.sheet-btn{width:100%;height:42px;background:linear-gradient(135deg,#5b6cff,#8e6cff);color:#fff;border:none;border-radius:10px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}

.toast{position:absolute;top:80px;left:50%;transform:translateX(-50%) translateY(-20px);background:rgba(0,0,0,.8);color:#fff;padding:8px 18px;border-radius:20px;font-size:13px;z-index:50;opacity:0;visibility:hidden;transition:opacity .25s,transform .25s,visibility .25s}
.toast.show{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="scheme-title">
  <b>方案 A - 竖屏单栏布局</b>
  <span class="tag">竖屏 390x844</span><span class="tag">顶部输入</span><span class="tag">底部 Tab</span><span class="tag">底部弹窗</span>
  <div style="margin-top:6px">适合单手操作，弹幕全屏滚动，Tab 切换弹幕/礼物/数据</div>
</div>

<div class="phone">
  <div class="statusbar">
    <span>9:41</span>
    <div class="right">
      <div class="bar-sig"><i></i><i></i><i></i><i></i></div>
      <div class="wifi"><i></i><i></i><i></i></div>
      <div class="batt"><i></i></div>
    </div>
  </div>

  <div class="topbar">
    <input class="room-input" id="roomInput" type="text" placeholder="输入房间号" value="80017765432">
    <button class="connect-btn" id="connectBtn">连接</button>
    <button class="key-btn" id="keyBtn" aria-label="设置 sessionid">
      <svg class="key-svg" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="M11 12 L20 3 M17 6 L19 8 M14 9 L16 11"/></svg>
      <span class="key-dot ok" id="keyDot"></span>
    </button>
  </div>

  <div class="content">
    <div class="tab-pane active" id="pane-danmu"></div>
    <div class="tab-pane" id="pane-gift"></div>
    <div class="tab-pane" id="pane-data">
      <div class="data-grid">
        <div class="data-card"><div class="data-label">在线观众</div><div class="data-value">12,486</div></div>
        <div class="data-card"><div class="data-label">累计观看</div><div class="data-value green">58,920</div></div>
        <div class="data-card"><div class="data-label">本场点赞</div><div class="data-value pink">3,205</div></div>
        <div class="data-card"><div class="data-label">新增粉丝</div><div class="data-value gold">186</div></div>
        <div class="data-card"><div class="data-label">粉丝总数</div><div class="data-value">42,158</div></div>
        <div class="data-card"><div class="data-label">最高在线</div><div class="data-value green">15,302</div></div>
        <div class="data-card"><div class="data-label">音浪收入</div><div class="data-value gold">8,640</div></div>
        <div class="data-card"><div class="data-label">送礼人数</div><div class="data-value pink">328</div></div>
      </div>
    </div>

    <div class="sheet-mask" id="sheetMask">
      <div class="sheet">
        <div class="sheet-grip"></div>
        <div class="sheet-title">设置 sessionid</div>
        <input class="sheet-input" id="sessionInput" type="text" placeholder="粘贴你的 sessionid">
        <div class="sheet-hint">获取指引：浏览器打开抖音直播间网页版，按 F12 打开开发者工具，在 Cookie 中找到 <code>sessionid</code> 字段并复制其值。</div>
        <button class="sheet-btn" id="saveSessionBtn">保存</button>
      </div>
    </div>

    <div class="toast" id="toast"></div>
  </div>

  <div class="bottombar">
    <button class="tab-btn active" data-tab="danmu">
      <svg class="tab-ico" viewBox="0 0 24 24"><path d="M3 5h18v10H3z M7 19h10 M12 15v4"/></svg>
      弹幕
    </button>
    <button class="tab-btn" data-tab="gift">
      <svg class="tab-ico" viewBox="0 0 24 24"><path d="M4 8h16v12H4z M4 8l4-4 M20 8l-4-4 M12 4v16 M2 8h20"/></svg>
      礼物
    </button>
    <button class="tab-btn" data-tab="data">
      <svg class="tab-ico" viewBox="0 0 24 24"><path d="M4 13h6v7H4z M14 4h6v16h-6z M4 4h6v7H4z"/></svg>
      数据
    </button>
  </div>
</div>

<script>
(function(){
  var ucolors=['#ff6b9d','#4fc3f7','#ffd166','#5fd35f','#b388ff','#ff9f43','#4dd0e1','#f06292'];
  var danmu=[
    {n:'星河漫游者',t:'主播今天这身衣服太好看了吧',c:0},
    {n:'柠檬不萌',t:'哈哈哈哈这个梗我也玩过',c:1},
    {n:'夏天的风',t:'已三连 关注啦 期待下一场直播',c:2},
    {n:'猫咪不吃鱼',t:'这个声线真的绝了 听得我鸡皮疙瘩',c:3},
    {n:'夜空中最亮的星',t:'刚进来 请问这是第一次直播吗',c:4},
    {n:'咸鱼翻身记',t:'主播能不能唱一首晚风心里吹',c:5},
    {n:'云端漫步',t:'这画质好清晰 什么设备呀',c:6},
    {n:'芒果布丁',t:'我来晚了 错过了什么精彩环节',c:7},
    {n:'听风说你来过',t:'主播笑起来真好看 多笑笑呀',c:0},
    {n:'森林系少女',t:'已下单同款口红 哈哈哈',c:1},
    {n:'失眠的猫头鹰',t:'这个时间点直播太适合我了',c:2},
    {n:'追光少年',t:'冲冲冲 今天要冲榜一',c:3}
  ];
  var gifts=[
    {n:'星河漫游者',g:'爱心玫瑰',num:9,c:0},
    {n:'追光少年',g:'嘉年华',num:1,c:3},
    {n:'云端漫步',g:'火箭',num:5,c:6},
    {n:'芒果布丁',g:'棒棒糖',num:66,c:7},
    {n:'听风说你来过',g:'城堡',num:1,c:4},
    {n:'夜空中最亮的星',g:'亲吻',num:99,c:5}
  ];

  function avatar(name,color){
    var s=name.replace(/\s/g,'').slice(0,1);
    return '<div class="avatar" style="background:linear-gradient(135deg,'+ucolors[color]+','+ucolors[(color+3)%ucolors.length]+')">'+s+'</div>';
  }

  var dp=document.getElementById('pane-danmu');
  var html='';
  for(var i=0;i<danmu.length;i++){
    var d=danmu[i];
    html+='<div class="msg">'+avatar(d.n,d.c)+
      '<div class="msg-body"><div class="msg-name" style="color:'+ucolors[d.c]+'">'+d.n+'</div>'+
      '<div class="msg-text">'+d.t+'</div></div></div>';
  }
  dp.innerHTML=html;

  var gp=document.getElementById('pane-gift');
  var gh='';
  for(var j=0;j<gifts.length;j++){
    var gf=gifts[j];
    var gi=gf.g.slice(0,1);
    gh+='<div class="gift-item">'+avatar(gf.n,gf.c)+
      '<div style="flex:1;min-width:0"><div class="msg-name" style="color:'+ucolors[gf.c]+';font-size:12px">'+gf.n+'</div>'+
      '<div class="gift-name">'+gf.g+'</div></div>'+
      '<div class="gift-icon">'+gi+'</div>'+
      '<div class="gift-count">x'+gf.num+'</div></div>';
  }
  gp.innerHTML=gh;

  var tabs=document.querySelectorAll('.tab-btn');
  var panes={danmu:document.getElementById('pane-danmu'),gift:document.getElementById('pane-gift'),data:document.getElementById('pane-data')};
  for(var k=0;k<tabs.length;k++){
    tabs[k].addEventListener('click',function(){
      var t=this.getAttribute('data-tab');
      for(var m=0;m<tabs.length;m++){tabs[m].classList.remove('active');}
      this.classList.add('active');
      for(var key in panes){panes[key].classList.remove('active');}
      panes[t].classList.add('active');
    });
  }

  var toastEl=document.getElementById('toast');
  var toastTimer;
  function toast(msg){
    toastEl.textContent=msg;
    toastEl.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer=setTimeout(function(){toastEl.classList.remove('show');},2000);
  }

  var connectBtn=document.getElementById('connectBtn');
  var roomInput=document.getElementById('roomInput');
  connectBtn.addEventListener('click',function(){
    var v=roomInput.value.trim();
    if(!v){toast('请输入房间号');return;}
    connectBtn.textContent='连接中';
    setTimeout(function(){
      connectBtn.textContent='已连接';
      toast('已连接房间 '+v);
    },900);
  });

  var sheetMask=document.getElementById('sheetMask');
  var keyBtn=document.getElementById('keyBtn');
  var sessionInput=document.getElementById('sessionInput');
  keyBtn.addEventListener('click',function(){
    sheetMask.classList.add('active');
    sessionInput.focus();
  });
  sheetMask.addEventListener('click',function(e){
    if(e.target===sheetMask){sheetMask.classList.remove('active');}
  });
  document.getElementById('saveSessionBtn').addEventListener('click',function(){
    var v=sessionInput.value.trim();
    if(!v){toast('请输入 sessionid');return;}
    document.getElementById('keyDot').classList.add('ok');
    sheetMask.classList.remove('active');
    sessionInput.value='';
    toast('sessionid 已保存');
  });
})();
</script>
</body>
</html>
